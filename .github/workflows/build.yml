name: Build

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    # windows-latest ships Visual Studio 2026, matching the "Visual Studio
    # 18 2026" generator the windows-msvc configure preset already uses --
    # no CI-specific preset or generator override needed.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Check CMake version
        run: cmake --version

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build (${{ matrix.build_type }})
        run: cmake --build --preset windows-msvc-${{ matrix.build_type }}

      - name: Test (${{ matrix.build_type }})
        run: ctest --preset windows-msvc-${{ matrix.build_type }}

  linux-gcc:
    # ubuntu-latest is Ubuntu 24.04 with GCC 13 by default
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-gcc-release]
    steps:
      - uses: actions/checkout@v4

      - name: Check CMake version
        run: cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  linux-gcc-asan:
    # AddressSanitizer/UndefinedBehaviorSanitizer are opt-in
    # (FLUXION_ENABLE_ASAN), never the default build -- sanitizer
    # instrumentation costs real runtime/memory overhead, so this runs as
    # its own separate job instead of folding into the matrix above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan + UBSan)
        run: cmake --preset linux-gcc -DFLUXION_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build --preset linux-gcc

      - name: Test
        run: ctest --preset linux-gcc
