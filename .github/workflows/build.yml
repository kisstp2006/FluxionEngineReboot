name: Build

on:
  # Unfiltered on purpose -- the build/test jobs below must keep running
  # on every ordinary branch push too, not just version tags. The release
  # job further down has its own `if:` gating it to tag pushes/manual
  # runs only, so a normal push never publishes a release.
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish under (e.g. v0.1.0-dev) -- only used for a manual run, ignored when triggered by a pushed tag"
        required: false
        default: ''

jobs:
  windows-msvc:
    # windows-latest ships Visual Studio 2026, matching the "Visual Studio
    # 18 2026" generator the windows-msvc configure preset already uses --
    # no CI-specific preset or generator override needed.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
    steps:
      - uses: actions/checkout@v4

      # The RHI module and the vendored VMA both resolve Vulkan through
      # find_package(Vulkan), which needs a real SDK -- the runner image
      # has none, unlike a desktop dev machine. Installed silently from
      # LunarG; the SDK also brings dxc, so the shader/script tests that
      # skip themselves without it actually run here.
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          $sdk = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw 'the Vulkan SDK installer did not leave anything under C:\VulkanSDK' }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Check CMake version
        run: cmake --version

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build (${{ matrix.build_type }})
        run: cmake --build --preset windows-msvc-${{ matrix.build_type }}

      - name: Test (${{ matrix.build_type }})
        run: ctest --preset windows-msvc-${{ matrix.build_type }}

      # Packaged once, from the Release leg only -- Debug binaries aren't
      # meant to be distributed. Include/ is the same across configs, so
      # it's copied straight from source rather than from the build tree.
      - name: Package release artifact
        if: matrix.build_type == 'release'
        shell: bash
        run: |
          set -e
          PKG=dist/FluxionEngine-windows-msvc
          mkdir -p "$PKG/lib" "$PKG/bin" "$PKG/Include"
          for m in Foundation Platform Core Application; do
            cp -r "Source/$m/Include/." "$PKG/Include/"
          done
          shopt -s globstar nullglob
          cp build/windows-msvc/**/Release/*.lib "$PKG/lib/"
          cp build/windows-msvc/Samples/InputDemo/Release/InputDemo.exe "$PKG/bin/"
          cp license.md README.md "$PKG/"

      - name: Upload release artifact
        if: matrix.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: FluxionEngine-windows-msvc
          path: dist/FluxionEngine-windows-msvc

  linux-gcc:
    # ubuntu-latest is Ubuntu 24.04 with GCC 13 by default
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-gcc-release]
    steps:
      - uses: actions/checkout@v4

      # The Application module's X11 backend needs these dev packages
      # (Xlib + Xrandr extension) to configure -- not present on a bare
      # ubuntu-latest runner image, unlike a desktop dev machine. Xvfb
      # provides a virtual X server for ApplicationTests to actually open
      # a window against -- the runner itself is headless, unlike a local
      # WSL2/WSLg setup which already has a real DISPLAY.
      #
      # The three OpenGL packages are one per thing find_package(OpenGL)
      # looks for: libopengl-dev has libOpenGL.so, libglx-dev has
      # libGLX.so, libgl-dev has the GL headers. The RHI asks for OpenGL
      # as REQUIRED on desktop Linux, and deliberately so -- a Linux
      # machine HAS desktop GL, and missing dev packages are an
      # incomplete environment rather than a target without the
      # capability. Quietly dropping the backend instead would let CI go
      # green on a build that ships one renderer fewer than it says.
      - name: Install X11, OpenGL and Vulkan dev packages
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libgl-dev libglx-dev libopengl-dev libvulkan-dev xvfb

      - name: Check CMake version
        run: cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: xvfb-run -a ctest --preset ${{ matrix.preset }}

      - name: Package release artifact
        if: matrix.preset == 'linux-gcc-release'
        run: |
          set -e
          PKG=dist/FluxionEngine-linux-gcc
          mkdir -p "$PKG/lib" "$PKG/bin" "$PKG/Include"
          for m in Foundation Platform Core Application; do
            cp -r "Source/$m/Include/." "$PKG/Include/"
          done
          shopt -s globstar nullglob
          cp build/linux-gcc-release/**/*.a "$PKG/lib/"
          cp build/linux-gcc-release/Samples/InputDemo/InputDemo "$PKG/bin/"
          cp license.md README.md "$PKG/"

      - name: Upload release artifact
        if: matrix.preset == 'linux-gcc-release'
        uses: actions/upload-artifact@v4
        with:
          name: FluxionEngine-linux-gcc
          path: dist/FluxionEngine-linux-gcc

  linux-gcc-asan:
    # AddressSanitizer/UndefinedBehaviorSanitizer are opt-in
    # (FLUXION_ENABLE_ASAN), never the default build -- sanitizer
    # instrumentation costs real runtime/memory overhead, so this runs as
    # its own separate job instead of folding into the matrix above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same set as the build job above, and for the same reasons.
      - name: Install X11, OpenGL and Vulkan dev packages
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libgl-dev libglx-dev libopengl-dev libvulkan-dev xvfb

      - name: Configure (ASan + UBSan)
        run: cmake --preset linux-gcc -DFLUXION_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build --preset linux-gcc

      - name: Test
        run: xvfb-run -a ctest --preset linux-gcc

  release:
    # Packages the Windows + Linux release artifacts from the two build
    # jobs above into a GitHub Release -- only on a pushed version tag or
    # an explicit manual run, never on an ordinary push/PR.
    needs: [windows-msvc, linux-gcc, linux-gcc-asan]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.version }}" ]; then
              echo "workflow_dispatch requires a non-empty 'version' input (e.g. v0.1.0-dev)" >&2
              exit 1
            fi
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: FluxionEngine-windows-msvc
          path: dist/FluxionEngine-windows-msvc

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: FluxionEngine-linux-gcc
          path: dist/FluxionEngine-linux-gcc

      - name: Zip artifacts
        run: |
          cd dist
          zip -r FluxionEngine-windows-msvc.zip FluxionEngine-windows-msvc
          zip -r FluxionEngine-linux-gcc.zip FluxionEngine-linux-gcc

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/FluxionEngine-windows-msvc.zip
            dist/FluxionEngine-linux-gcc.zip
